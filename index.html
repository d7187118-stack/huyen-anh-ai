<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Huyễn Ảnh AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#080d1f,#16102d,#071b28);
  color:white;
}

header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.logo span{
  color:#c084fc;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  padding:20px;
  margin-top:20px;
}

h1{
  font-size:28px;
  margin-bottom:10px;
}

p{
  color:#b8b8c8;
  line-height:1.5;
}

textarea{
  width:100%;
  min-height:150px;
  margin-top:18px;
  padding:16px;
  border-radius:15px;
  border:1px solid #4c3b75;
  background:#0b1020;
  color:white;
  font-size:16px;
  resize:vertical;
}

textarea:focus{
  outline:none;
  border-color:#a855f7;
}

.options{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

button{
  border:none;
  border-radius:12px;
  padding:13px 18px;
  font-size:15px;
  cursor:pointer;
}

.option{
  background:#1b2138;
  color:white;
  border:1px solid #333a55;
}

.option.active{
  background:#6d28d9;
}

.generate{
  width:100%;
  margin-top:18px;
  padding:16px;
  background:linear-gradient(90deg,#7c3aed,#db2777);
  color:white;
  font-size:18px;
  font-weight:bold;
}

.generate:active{
  transform:scale(.98);
}

.result{
  min-height:300px;
  margin-top:20px;
  border-radius:20px;
  border:2px dashed #3b2b5f;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  background:rgba(0,0,0,.15);
}

.result img{
  max-width:100%;
  max-height:600px;
  border-radius:15px;
}

.placeholder{
  color:#8888a5;
  font-size:17px;
}

footer{
  text-align:center;
  padding:30px 10px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="logo">⚔️ Huyễn <span>Ảnh AI</span> 🖼️</div>
</header>

<div class="container">

<div class="card">
  <h1>Thiên Cơ Họa Ảnh ✨</h1>

  <p>
    Nhập mô tả của ngươi. Huyễn Ảnh AI sẽ biến ý tưởng thành hình ảnh.
  </p>

  <textarea id="prompt"
  placeholder="Ví dụ: Một nữ tu đứng trên đỉnh núi, xung quanh là mây đen và lôi kiếp, phong cách tiên hiệp, ánh sáng điện ảnh..."></textarea>

  <div class="options">

    <button class="option active" onclick="selectStyle(this)">
      ⚔️ Tu tiên
    </button>

    <button class="option" onclick="selectStyle(this)">
      🌙 Huyền huyễn
    </button>

    <button class="option" onclick="selectStyle(this)">
      🎨 Anime
    </button>

    <button class="option" onclick="selectStyle(this)">
      📷 Realistic
    </button>

  </div>

  <button class="generate" onclick="generateImage()">
    ✨ Tạo ảnh
  </button>

</div>

<div class="card">

  <h2>🔮 Kết quả</h2>

  <div class="result" id="result">

    <div class="placeholder">
      🖼️ Ảnh của ngươi sẽ xuất hiện tại đây
    </div>

  </div>

</div>

</div>

<footer>
  Huyễn Ảnh AI ⚔️
</footer>

<script>

let selectedStyle="Tu tiên";

function selectStyle(button){

  document.querySelectorAll(".option").forEach(btn=>{
    btn.classList.remove("active");
  });

  button.classList.add("active");

  selectedStyle=button.innerText;

}

function generateImage(){

  const prompt=document.getElementById("prompt").value.trim();

  const result=document.getElementById("result");

  if(!prompt){

    alert("Hãy nhập mô tả ảnh trước!");

    return;

  }

  result.innerHTML=`
    <div class="placeholder">
      🔮 Đang triệu hồi hình ảnh...<br><br>
      <small>${selectedStyle}</small>
    </div>
  `;

  setTimeout(()=>{

    result.innerHTML=`
      <div class="placeholder">
        ⚠️ Giao diện đã hoạt động!<br><br>
        Bước tiếp theo chúng ta sẽ kết nối AI thật để tạo ảnh.
      </div>
    `;

  },1500);

}

</script>

</body>
  </html>
