<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Huyền Ảnh AI ✨</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #17172b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 600px;
      background: #22223a;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      height: 130px;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, #7b2ff7, #f107a3);
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      margin: 20px 0;
      min-height: 24px;
    }

    #result {
      width: 100%;
      display: none;
      border-radius: 15px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>⚔️ Huyền Ảnh AI ✨</h1>

    <textarea
      id="prompt"
      placeholder="Nhập mô tả hình ảnh..."
    ></textarea>

    <button id="generateBtn" onclick="generateImage()">
      ✨ Tạo ảnh
    </button>

    <div id="status"></div>

    <img id="result">

  </div>


  <script>

    async function generateImage() {

      const prompt = document
        .getElementById("prompt")
        .value
        .trim();

      const button =
        document.getElementById("generateBtn");

      const status =
        document.getElementById("status");

      const result =
        document.getElementById("result");


      if (!prompt) {

        status.innerText =
          "⚠️ Hãy nhập mô tả hình ảnh!";

        return;
      }


      button.disabled = true;

      button.innerText =
        "⏳ Đang tạo...";

      status.innerText =
        "🎨 AI đang vẽ ảnh...";

      result.style.display =
        "none";


      try {

        const response = await fetch(
          "https://wandering-cloud-0b6c.d7187118-cbe.workers.dev",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              prompt: prompt
            })
          }
        );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Không thể tạo ảnh"
          );
        }


        result.src =
          data.image;

        result.style.display =
          "block";

        status.innerText =
          "✨ Tạo ảnh thành công!";

      }

      catch (error) {

        console.error(error);

        status.innerText =
          "❌ Lỗi: " +
          error.message;

      }


      button.disabled =
        false;

      button.innerText =
        "✨ Tạo ảnh";

    }

  </script>

</body>
</html>
