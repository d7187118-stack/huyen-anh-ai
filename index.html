<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Huyền Ảnh AI</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at top,#49317a,#1b1830 45%,#080811);
}

.container{
  max-width:850px;
  margin:auto;
  padding:28px 14px 60px;
}

header{
  text-align:center;
  margin-bottom:28px;
}

h1{
  margin:0;
  font-size:36px;
}

.subtitle{
  margin-top:10px;
  color:#c9c2e6;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tab{
  flex:1;
  border:0;
  padding:15px;
  border-radius:14px;
  color:white;
  background:rgba(255,255,255,.08);
  font-size:16px;
  cursor:pointer;
}

.tab.active{
  background:linear-gradient(135deg,#743cff,#d52f9c);
}

.card{
  padding:20px;
  border-radius:24px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

label{
  display:block;
  margin:16px 0 8px;
}

textarea,
select,
input[type=text],
input[type=password],
input[type=file]{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.25);
  color:white;
  font-size:16px;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.presets{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.preset{
  width:auto;
  margin:0;
  padding:10px 13px;
  border:0;
  border-radius:20px;
  background:rgba(255,255,255,.1);
  color:white;
  cursor:pointer;
}

.main-btn{
  width:100%;
  margin-top:18px;
  padding:18px;
  border:0;
  border-radius:16px;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  background:
    linear-gradient(
      135deg,
      #713cff,
      #d52f9c,
      #ed4b72
    );
}

.main-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

#preview{
  display:none;
  width:100%;
  max-height:400px;
  object-fit:contain;
  margin-top:15px;
  border-radius:16px;
}

.status{
  min-height:25px;
  margin-top:18px;
  text-align:center;
  color:#d8cff7;
}

.result-box{
  display:none;
  margin-top:24px;
  padding:10px;
  border-radius:22px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
}

.result-box.show{
  display:block;
}

#result{
  display:block;
  width:100%;
  border-radius:16px;
}

.download{
  display:block;
  margin-top:10px;
  padding:14px;
  text-align:center;
  border-radius:14px;
  background:rgba(255,255,255,.12);
  color:white;
  text-decoration:none;
}

.key-note{
  margin-top:8px;
  font-size:13px;
  color:#bdb5d7;
  line-height:1.5;
}

.small-btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.1);
  color:white;
  cursor:pointer;
  font-size:15px;
}
</style>

</head>

<body>

<div class="container">

<header>

<h1>⚔️ HUYỀN ẢNH AI ✨</h1>

<div class="subtitle">
Một niệm hóa vạn tượng · Tiên đạo vô tận
</div>

</header>


<div class="card">

<!-- API KEY -->

<label>🔑 Pollinations API Key</label>

<input
  type="password"
  id="apiKey"
  placeholder="Dán API key vào đây...">

<div class="key-note">
Key được lưu tạm trong phiên trình duyệt này.
</div>

<button
  class="small-btn"
  onclick="saveApiKey()">

💾 Lưu API Key

</button>


<!-- TABS -->

<div class="tabs" style="margin-top:20px">

<button
  class="tab active"
  onclick="switchTab('generate',this)">

✨ Tạo mới

</button>

<button
  class="tab"
  onclick="switchTab('edit',this)">

🖼️ Biến ảnh

</button>

</div>


<!-- TẠO ẢNH -->

<div
  id="generate"
  class="panel active">

<label>✨ Mô tả hình ảnh</label>

<textarea
  id="prompt"
  placeholder="Ví dụ: Một nữ kiếm tiên đứng trên đỉnh núi giữa biển mây, trường kiếm phát sáng, tiên hiệp cinematic..."
></textarea>


<div class="presets">

<button
  class="preset"
  onclick="setPrompt('Một kiếm tiên áo trắng đứng trên đỉnh núi giữa biển mây, cầm trường kiếm, tiên hiệp fantasy, cinematic, cực kỳ chi tiết')">

⚔️ Kiếm tiên

</button>


<button
  class="preset"
  onclick="setPrompt('Một nữ tu tiên đứng một mình giữa thiên địa, núi non hùng vĩ, mây đen và lôi kiếp giáng xuống, tiên hiệp cinematic')">

⚡ Độ kiếp

</button>


<button
  class="preset"
  onclick="setPrompt('Một tiên cung cổ đại lơ lửng giữa biển mây, núi non, thác nước, ánh sáng thần bí, fantasy cinematic')">

🏯 Tiên cảnh

</button>


<button
  class="preset"
  onclick="setPrompt('Một ma tôn đứng giữa biển lửa và ma khí, áo choàng tung bay, dark xianxia fantasy, cinematic')">

🌑 Ma đạo

</button>

</div>


<button
  id="generateBtn"
  class="main-btn"
  onclick="generateImage()">

✨ Khai Thiên · Tạo Ảnh

</button>

</div>


<!-- BIẾN ẢNH -->

<div
  id="edit"
  class="panel">

<label>🖼️ Chọn ảnh gốc</label>

<input
  type="file"
  id="imageInput"
  accept="image/*"
  onchange="previewImage()">

<img id="preview">


<label>⚔️ Chọn phong cách</label>

<select id="style">

<option>⚔️ Tiên hiệp</option>

<option>🌸 Cổ phong</option>

<option>✨ Anime</option>

<option>🌑 Ma đạo</option>

<option>☁️ Tiên cảnh</option>

</select>


<label>✨ Mô tả thêm</label>

<textarea
  id="editPrompt"
  placeholder="Ví dụ: biến nhân vật thành nữ kiếm tiên, áo trắng, đứng giữa biển mây..."
></textarea>


<button
  id="editBtn"
  class="main-btn"
  onclick="editImage()">

🌀 Biến Hóa

</button>

</div>


<div
  id="status"
  class="status">

⚡ Một niệm hóa vạn tượng...

</div>

</div>


<!-- KẾT QUẢ -->

<div
  id="resultBox"
  class="result-box">

<img id="result">

<a
  id="download"
  class="download"
  download="huyen-anh-ai.png">

⬇️ Lưu ảnh

</a>

</div>

</div>


<script>

/* =========================
   KHỞI TẠO API KEY
========================= */

const savedKey =
  sessionStorage.getItem(
    "pollinations_api_key"
  );

if(savedKey){

  document.getElementById(
    "apiKey"
  ).value=savedKey;

}


/* =========================
   LƯU API KEY
========================= */

function saveApiKey(){

  const key=
    document
      .getElementById("apiKey")
      .value
      .trim();

  const status=
    document
      .getElementById("status");

  if(!key){

    status.textContent=
      "⚠️ Hãy nhập API key.";

    return;

  }

  sessionStorage.setItem(
    "pollinations_api_key",
    key
  );

  status.textContent=
    "🔑 API key đã được lưu tạm.";

}


/* =========================
   LẤY API KEY
========================= */

function getApiKey(){

  const inputKey=
    document
      .getElementById("apiKey")
      .value
      .trim();

  if(inputKey){

    sessionStorage.setItem(
      "pollinations_api_key",
      inputKey
    );

    return inputKey;

  }

  return sessionStorage.getItem(
    "pollinations_api_key"
  );

}


/* =========================
   ĐỔI TAB
========================= */

function switchTab(name,button){

  document
    .querySelectorAll(".panel")
    .forEach(function(panel){

      panel.classList.remove(
        "active"
      );

    });


  document
    .querySelectorAll(".tab")
    .forEach(function(tab){

      tab.classList.remove(
        "active"
      );

    });


  document
    .getElementById(name)
    .classList.add("active");


  button.classList.add("active");

}


/* =========================
   PRESET PROMPT
========================= */

function setPrompt(text){

  document
    .getElementById("prompt")
    .value=text;

}


/* =========================
   XEM TRƯỚC ẢNH
========================= */

function previewImage(){

  const file=
    document
      .getElementById("imageInput")
      .files[0];

  const preview=
    document
      .getElementById("preview");

  if(!file)return;


  preview.src=
    URL.createObjectURL(file);


  preview.style.display=
    "block";

}


/* =========================
   HIỂN THỊ KẾT QUẢ
========================= */

function showResult(imageUrl){

  document
    .getElementById("result")
    .src=imageUrl;


  document
    .getElementById("download")
    .href=imageUrl;


  document
    .getElementById("resultBox")
    .classList.add("show");


  document
    .getElementById("resultBox")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


/* =========================
   TẠO ẢNH MỚI
========================= */

async function generateImage(){

  const prompt=
    document
      .getElementById("prompt")
      .value
      .trim();


  const button=
    document
      .getElementById("generateBtn");


  const status=
    document
      .getElementById("status");


  const apiKey=getApiKey();


  if(!prompt){

    status.textContent=
      "⚠️ Hãy nhập mô tả ảnh.";

    return;

  }


  if(!apiKey){

    status.textContent=
      "🔑 Hãy nhập Pollinations API key trước.";

    return;

  }


  button.disabled=true;

  button.textContent=
    "⏳ Thiên địa đang diễn hóa...";


  status.textContent=
    "🎨 Đang triệu hồi hình ảnh...";


  try{

    const response=
      await fetch(
        "https://gen.pollinations.ai/v1/images/generations",
        {

          method:"POST",

          headers:{

            "Authorization":
              "Bearer "+apiKey,

            "Content-Type":
              "application/json"

          },

          body:JSON.stringify({

            model:"flux",

            prompt:prompt,

            size:"1024x1024",

            n:1,

            response_format:"b64_json"

          })

        }
      );


    if(!response.ok){

      const errorText=
        await response.text();

      throw new Error(
        "Lỗi API "+
        response.status+
        ": "+
        errorText
      );

    }


    const data=
      await response.json();


    if(
      !data.data ||
      !data.data[0]
    ){

      throw new Error(
        "API không trả về ảnh."
      );

    }


    let imageUrl;


    if(data.data[0].b64_json){

      imageUrl=
        "data:image/png;base64,"+
        data.data[0].b64_json;

    }

    else if(data.data[0].url){

      imageUrl=
        data.data[0].url;

    }

    else{

      throw new Error(
        "Không tìm thấy dữ liệu ảnh."
      );

    }


    showResult(imageUrl);


    status.textContent=
      "✨ Vạn tượng đã hiện!";


  }

  catch(error){

    console.error(error);


    status.textContent=
      "❌ "+
      error.message;

  }


  button.disabled=false;


  button.textContent=
    "✨ Khai Thiên · Tạo Ảnh";

}


/* =========================
   BIẾN ẢNH
========================= */

async function editImage(){

  const file=
    document
      .getElementById("imageInput")
      .files[0];


  const style=
    document
      .getElementById("style")
      .value;


  const extra=
    document
      .getElementById("editPrompt")
      .value
      .trim();


  const button=
    document
      .getElementById("editBtn");


  const status=
    document
      .getElementById("status");


  const apiKey=getApiKey();


  if(!file){

    status.textContent=
      "⚠️ Hãy chọn ảnh trước.";

    return;

  }


  if(!apiKey){

    status.textContent=
      "🔑 Hãy nhập Pollinations API key trước.";

    return;

  }


  button.disabled=true;


  button.textContent=
    "⏳ Đang biến hóa...";


  status.textContent=
    "🌀 AI đang diễn hóa hình ảnh...";


  try{

    const prompt=

      "Chỉnh sửa hình ảnh được cung cấp. " +

      "Giữ lại nhân vật chính và các đặc điểm quan trọng " +

      "khi phù hợp với yêu cầu. " +

      "Phong cách mong muốn: "+
      style+
      ". " +

      (extra
        ? "Yêu cầu bổ sung: "+extra+". "
        : ""
      ) +

      "Hình ảnh chất lượng cao, chi tiết, cinematic.";


    const formData=
      new FormData();


    formData.append(
      "image",
      file
    );


    formData.append(
      "prompt",
      prompt
    );


    formData.append(
      "model",
      "p-image-edit"
    );


    formData.append(
      "size",
      "1024x1024"
    );


    formData.append(
      "n",
      "1"
    );


    formData.append(
      "response_format",
      "b64_json"
    );


    const response=
      await fetch(
        "https://gen.pollinations.ai/v1/images/edits",
        {

          method:"POST",

          headers:{

            "Authorization":
              "Bearer "+apiKey

          },

          body:formData

        }
      );


    if(!response.ok){

      const errorText=
        await response.text();


      throw new Error(
        "Lỗi API "+
        response.status+
        ": "+
        errorText
      );

    }


    const data=
      await response.json();


    if(
      !data.data ||
      !data.data[0]
    ){

      throw new Error(
        "API không trả về ảnh."
      );

    }


    let imageUrl;


    if(data.data[0].b64_json){

      imageUrl=
        "data:image/png;base64,"+
        data.data[0].b64_json;

    }

    else if(data.data[0].url){

      imageUrl=
        data.data[0].url;

    }

    else{

      throw new Error(
        "Không tìm thấy dữ liệu ảnh."
      );

    }


    showResult(imageUrl);


    status.textContent=
      "✨ Biến hóa thành công!";


  }

  catch(error){

    console.error(error);


    status.textContent=
      "❌ "+
      error.message;

  }


  button.disabled=false;


  button.textContent=
    "🌀 Biến Hóa";

}

</script>

</body>
                     </html>
