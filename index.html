<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Huyền Ảnh AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at top, #49317a 0%, #1b1830 42%, #080811 100%);
}

.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 28px 14px 60px;
}

header {
  text-align: center;
  margin-bottom: 28px;
}

h1 {
  margin: 0;
  font-size: 36px;
}

.subtitle {
  color: #c9c2e6;
  margin-top: 10px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.tab {
  flex: 1;
  margin: 0;
  padding: 14px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.08);
  color: white;
  border-radius: 14px;
  cursor: pointer;
}

.tab.active {
  background: linear-gradient(135deg,#743cff,#d52f9c);
}

.card {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 24px;
  padding: 20px;
  backdrop-filter: blur(12px);
}

.panel {
  display: none;
}

.panel.active {
  display: block;
}

label {
  display: block;
  margin: 15px 0 8px;
}

textarea,
input[type="text"],
select {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(0,0,0,.25);
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

input[type="file"] {
  width: 100%;
  padding: 12px;
  border-radius: 14px;
  background: rgba(255,255,255,.08);
}

.main-btn {
  width: 100%;
  border: 0;
  margin-top: 18px;
  padding: 17px;
  border-radius: 16px;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(135deg,#713cff,#d52f9c,#ed4b72);
}

.main-btn:disabled {
  opacity: .55;
}

.presets {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.preset {
  width: auto;
  margin: 0;
  padding: 9px 12px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.08);
  color: white;
  cursor: pointer;
}

#preview {
  display: none;
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 16px;
}

.status {
  text-align: center;
  min-height: 25px;
  margin-top: 18px;
  color: #d8cff7;
}

.result-box {
  display: none;
  margin-top: 24px;
  padding: 10px;
  border-radius: 22px;
  background: rgba(255,255,255,.07);
}

.result-box.show {
  display: block;
}

#result {
  display: block;
  width: 100%;
  border-radius: 16px;
}

.download {
  display: block;
  margin-top: 10px;
  padding: 14px;
  text-align: center;
  border-radius: 14px;
  text-decoration: none;
  color: white;
  background: rgba(255,255,255,.12);
}

.key-box {
  margin-bottom: 18px;
  padding: 14px;
  border-radius: 16px;
  background: rgba(0,0,0,.22);
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>⚔️ HUYỀN ẢNH AI ✨</h1>
  <div class="subtitle">
    Tạo thế giới tiên hiệp · Biến hóa vạn tượng
  </div>
</header>

<div class="key-box">

<label>🔑 Pollinations API Key</label>

<input
  type="text"
  id="apiKey"
  placeholder="Dán key pk_... vào đây"
>

</div>

<div class="tabs">

<button
  class="tab active"
  onclick="switchTab('generate')"
>
✨ Tạo mới
</button>

<button
  class="tab"
  onclick="switchTab('edit')"
>
🖼️ Biến ảnh
</button>

</div>


<div class="card">

<!-- B: TẠO ẢNH MỚI -->

<div
  id="generate"
  class="panel active"
>

<label>✨ Mô tả hình ảnh</label>

<textarea
  id="prompt"
  placeholder="Ví dụ: Một nữ kiếm tiên đứng trên đỉnh núi giữa biển mây, trường kiếm phát sáng, tiên hiệp cinematic..."
></textarea>

<div class="presets">

<button
  class="preset"
  onclick="setPrompt('Một kiếm tiên áo trắng đứng trên đỉnh núi giữa biển mây, cầm trường kiếm, tiên hiệp fantasy, cinematic, cực kỳ chi tiết')"
>
⚔️ Kiếm tiên
</button>

<button
  class="preset"
  onclick="setPrompt('Một nữ tu tiên đứng một mình giữa thiên địa, xung quanh núi non, mây đen và lôi kiếp giáng xuống, tiên hiệp hoành tráng, cinematic')"
>
⚡ Độ kiếp
</button>

<button
  class="preset"
  onclick="setPrompt('Một tiên cung cổ đại lơ lửng giữa biển mây, núi non hùng vĩ, thác nước, ánh sáng thần bí, fantasy cinematic')"
>
🏯 Tiên cảnh
</button>

<button
  class="preset"
  onclick="setPrompt('Một ma tôn đứng giữa biển lửa và ma khí, áo choàng tung bay, tiên hiệp dark fantasy, cinematic')"
>
🌑 Ma đạo
</button>

</div>

<button
  id="generateBtn"
  class="main-btn"
  onclick="generateImage()"
>
✨ Khai Thiên · Tạo Ảnh
</button>

</div>


<!-- C: BIẾN ẢNH -->

<div
  id="edit"
  class="panel"
>

<label>🖼️ Chọn ảnh gốc</label>

<input
  type="file"
  id="imageInput"
  accept="image/*"
  onchange="previewImage()"
>

<img id="preview">

<label>⚔️ Phong cách</label>

<select id="style">

<option value="xianxia Chinese cultivation fantasy, immortal warrior, cinematic">
⚔️ Tiên hiệp
</option>

<option value="ancient Chinese hanfu, traditional Chinese fantasy, elegant">
🌸 Cổ phong
</option>

<option value="high quality anime style, detailed illustration">
✨ Anime
</option>

<option value="dark xianxia, demonic cultivation, dark fantasy, dramatic">
🌑 Ma đạo
</option>

<option value="celestial palace, mountains, clouds, divine fantasy">
☁️ Tiên cảnh
</option>

</select>

<label>✨ Thêm mô tả</label>

<textarea
  id="editPrompt"
  placeholder="Ví dụ: biến nhân vật thành nữ kiếm tiên, áo trắng, đứng giữa biển mây..."
></textarea>

<button
  id="editBtn"
  class="main-btn"
  onclick="editImage()"
>
🌀 Biến Hóa
</button>

</div>


<div
  id="status"
  class="status"
>
⚡ Một niệm hóa vạn tượng...
</div>

</div>


<div
  id="resultBox"
  class="result-box"
>

<img
  id="result"
  alt="Ảnh AI"
>

<a
  id="download"
  class="download"
  download="huyen-anh-ai.png"
>
⬇️ Lưu ảnh
</a>

</div>

</div>


<script>

function getKey() {

  return document
    .getElementById("apiKey")
    .value
    .trim();

}


function switchTab(name) {

  document
    .querySelectorAll(".panel")
    .forEach(panel => {

      panel.classList.remove("active");

    });


  document
    .querySelectorAll(".tab")
    .forEach(tab => {

      tab.classList.remove("active");

    });


  document
    .getElementById(name)
    .classList.add("active");


  event.target
    .classList.add("active");

}


function setPrompt(text) {

  document
    .getElementById("prompt")
    .value = text;

}


function previewImage() {

  const file =
    document
      .getElementById("imageInput")
      .files[0];

  const preview =
    document
      .getElementById("preview");


  if (!file) return;


  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

}


function showResult(url) {

  const result =
    document.getElementById("result");

  const box =
    document.getElementById("resultBox");

  const download =
    document.getElementById("download");


  result.src = url;

  download.href = url;

  box.classList.add("show");

  box.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


async function generateImage() {

  const prompt =
    document
      .getElementById("prompt")
      .value
      .trim();

  const key = getKey();

  const button =
    document.getElementById("generateBtn");

  const status =
    document.getElementById("status");


  if (!key) {

    status.textContent =
      "⚠️ Hãy nhập Pollinations API key.";

    return;

  }


  if (!prompt) {

    status.textContent =
      "⚠️ Hãy nhập mô tả ảnh.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "⏳ Đang khai thiên...";

  status.textContent =
    "🎨 AI đang tạo ảnh...";


  try {

    const response = await fetch(

      "https://gen.pollinations.ai/v1/images/generations",

      {
        method: "POST",

        headers: {
          "Authorization":
            "Bearer " + key,

          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          model: "flux",

          prompt: prompt,

          size: "1024x1024",

          response_format: "b64_json"

        })

      }

    );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data?.error?.message ||
        "Không thể tạo ảnh"
      );

    }


    const image =
      data?.data?.[0]?.b64_json;


    if (!image) {

      throw new Error(
        "AI không trả ảnh"
      );

    }


    const imageUrl =
      "data:image/png;base64," +
      image;


    showResult(imageUrl);


    status.textContent =
      "✨ Ảnh đã được tạo!";


  } catch (error) {

    status.textContent =
      "❌ " + error.message;

  }


  button.disabled = false;

  button.textContent =
    "✨ Khai Thiên · Tạo Ảnh";

}


async function editImage() {

  const key = getKey();

  const file =
    document
      .getElementById("imageInput")
      .files[0];

  const style =
    document
      .getElementById("style")
      .value;

  const extra =
    document
      .getElementById("editPrompt")
      .value
      .trim();

  const button =
    document.getElementById("editBtn");

  const status =
    document.getElementById("status");


  if (!key) {

    status.textContent =
      "⚠️ Hãy nhập Pollinations API key.";

    return;

  }


  if (!file) {

    status.textContent =
      "⚠️ Hãy chọn ảnh.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "🌀 Đang biến hóa...";

  status.textContent =
    "🎨 AI đang xử lý ảnh...";


  try {

    const formData =
      new FormData();


    formData.append(
      "image",
      file
    );


    formData.append(
      "prompt",

      "Transform this image into: " +
      style +
      ". " +
      extra
    );


    formData.append(
      "model",
      "kontext"
    );


    formData.append(
      "size",
      "1024x1024"
    );


    const response = await fetch(

      "https://gen.pollinations.ai/v1/images/edits",

      {
        method: "POST",

        headers: {

          "Authorization":
            "Bearer " + key

        },

        body: formData

      }

    );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data?.error?.message ||
        "Không thể biến đổi ảnh"
      );

    }


    const image =
      data?.data?.[0]?.b64_json;


    if (!image) {

      throw new Error(
        "AI không trả ảnh"
      );

    }


    const imageUrl =
      "data:image/png;base64," +
      image;


    showResult(imageUrl);


    status.textContent =
      "✨ Biến hóa thành công!";


  } catch (error) {

    status.textContent =
      "❌ " + error.message;

  }


  button.disabled = false;

  button.textContent =
    "🌀 Biến Hóa";

}

</script>

</body>
  </html>
