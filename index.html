<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Huyền Ảnh AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #151526;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 700px;
      background: #24243a;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 15px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #555;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      background: #7c3aed;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      text-align: center;
      margin: 20px 0;
    }

    img {
      width: 100%;
      display: none;
      border-radius: 15px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>✨ Huyền Ảnh AI</h1>

  <textarea
    id="prompt"
    placeholder="Nhập mô tả hình ảnh..."
  ></textarea>

  <button id="generate">
    ✨ Tạo ảnh
  </button>

  <div id="status"></div>

  <img id="image">

</div>

<script>

const WORKER_URL = "DAN_URL_WORKER_VAO_DAY";

const button = document.getElementById("generate");
const promptInput = document.getElementById("prompt");
const status = document.getElementById("status");
const image = document.getElementById("image");

button.onclick = async () => {

  const prompt = promptInput.value.trim();

  if (!prompt) {
    status.textContent = "⚠️ Hãy nhập mô tả ảnh";
    return;
  }

  button.disabled = true;
  status.textContent = "🎨 AI đang tạo ảnh...";
  image.style.display = "none";

  try {

    const response = await fetch(
      WORKER_URL + "/generate",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          prompt: prompt
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Không thể tạo ảnh"
      );
    }

    image.src = data.image;
    image.style.display = "block";

    status.textContent = "✨ Tạo ảnh thành công!";

  } catch (error) {

    status.textContent =
      "❌ " + error.message;

  }

  button.disabled = false;

};

</script>

</body>
</html>
