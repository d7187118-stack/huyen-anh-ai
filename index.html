<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Huyền Ảnh AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at top,#35245f 0%,#16152c 45%,#080812 100%);
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:30px 16px 60px;
}

header{
  text-align:center;
  margin-bottom:35px;
}

.logo{
  font-size:38px;
  font-weight:bold;
  letter-spacing:2px;
  text-shadow:0 0 20px #9d7cff;
}

.subtitle{
  margin-top:12px;
  color:#c8c1e6;
}

.card{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:22px;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
  backdrop-filter:blur(12px);
}

label{
  display:block;
  margin-bottom:10px;
  font-size:17px;
}

textarea{
  width:100%;
  min-height:150px;
  padding:18px;
  border:none;
  outline:none;
  border-radius:18px;
  resize:vertical;
  font-size:16px;
  color:white;
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.1);
}

textarea::placeholder{
  color:#aaa3c8;
}

.examples{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

.example{
  width:auto;
  margin:0;
  padding:10px 14px;
  font-size:14px;
  background:rgba(255,255,255,.09);
}

button{
  width:100%;
  margin-top:20px;
  padding:18px;
  border:none;
  border-radius:18px;
  color:white;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
  background:
    linear-gradient(135deg,#6d3df0,#b21fcf,#e23b82);
  box-shadow:0 8px 30px rgba(130,60,255,.35);
}

button:disabled{
  opacity:.55;
}

.status{
  text-align:center;
  min-height:25px;
  margin-top:18px;
  color:#d7cfff;
}

.result-box{
  display:none;
  margin-top:25px;
  padding:12px;
  border-radius:22px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
}

.result-box.show{
  display:block;
}

#result{
  display:block;
  width:100%;
  border-radius:16px;
}

.download{
  display:block;
  text-align:center;
  margin-top:12px;
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,.1);
  color:white;
  text-decoration:none;
}

.footer{
  text-align:center;
  color:#80799f;
  margin-top:25px;
  font-size:13px;
}

@media(max-width:600px){
  .logo{
    font-size:30px;
  }

  .container{
    padding:22px 12px 50px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">⚔️ HUYỀN ẢNH AI ✨</div>
  <div class="subtitle">
    Một niệm hóa vạn tượng · Nhập mô tả để tạo thế giới của riêng ngươi
  </div>
</header>

<div class="card">

<label>✨ Mô tả hình ảnh</label>

<textarea
  id="prompt"
  placeholder="Ví dụ: Một nữ kiếm tiên đứng trên đỉnh núi giữa biển mây, trường kiếm phát sáng, thiên kiếp và sấm sét phía xa, phong cách tiên hiệp cinematic..."
></textarea>

<div class="examples">

<button class="example" onclick="setPrompt('Một kiếm tiên áo trắng đứng trên đỉnh núi giữa biển mây, cầm trường kiếm, tiên hiệp fantasy, cinematic, cực kỳ chi tiết')">
⚔️ Kiếm tiên
</button>

<button class="example" onclick="setPrompt('Một nữ tu tiên đứng một mình giữa thiên địa, xung quanh là núi non và mây đen, lôi kiếp giáng xuống, tiên hiệp hoành tráng, cinematic')">
⚡ Độ kiếp
</button>

<button class="example" onclick="setPrompt('Một tiên cung cổ đại lơ lửng giữa biển mây, thác nước bay ngược, ánh sáng thần bí, fantasy cinematic, cực kỳ chi tiết')">
🏯 Tiên cảnh
</button>

</div>

<button id="generateBtn" onclick="generateImage()">
✨ Khai Thiên · Tạo Ảnh
</button>

<div id="status" class="status">
⚡ Nhập một ý niệm, vạn tượng sẽ hiện...
</div>

</div>

<div id="resultBox" class="result-box">

<img id="result" alt="Ảnh được tạo">

<a id="download" class="download" download="huyen-anh-ai.png">
⬇️ Lưu ảnh
</a>

</div>

<div class="footer">
  ⚔️ Huyền Ảnh AI · Tiên đạo vô tận
</div>

</div>

<script>

function setPrompt(text){
  document.getElementById("prompt").value=text;
}

async function generateImage(){

  const prompt=
    document.getElementById("prompt").value.trim();

  const button=
    document.getElementById("generateBtn");

  const status=
    document.getElementById("status");

  const result=
    document.getElementById("result");

  const resultBox=
    document.getElementById("resultBox");

  const download=
    document.getElementById("download");


  if(!prompt){

    status.textContent=
      "⚠️ Hãy nhập mô tả trước.";

    return;
  }


  button.disabled=true;

  button.textContent=
    "⏳ Thiên địa đang diễn hóa...";

  status.textContent=
    "🎨 Đang triệu hồi hình ảnh...";

  resultBox.classList.remove("show");


  try{

    /*
      Dịch vụ tạo ảnh qua URL.
      Prompt được mã hóa để dùng an toàn trong địa chỉ.
    */

    const imageUrl=
      "https://image.pollinations.ai/prompt/" +
      encodeURIComponent(prompt) +
      "?width=1024&height=1024&nologo=true";

    /*
      Chờ ảnh tải xong trước khi hiển thị.
    */

    await new Promise((resolve,reject)=>{

      const testImage=new Image();

      testImage.onload=()=>resolve();

      testImage.onerror=()=>reject(
        new Error("Không thể tạo ảnh. Hãy thử lại.")
      );

      testImage.src=imageUrl;

    });


    result.src=imageUrl;

    download.href=imageUrl;

    resultBox.classList.add("show");

    status.textContent=
      "✨ Vạn tượng đã hiện!";

    resultBox.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


  }catch(error){

    status.textContent=
      "❌ " + error.message;

  }


  button.disabled=false;

  button.textContent=
    "✨ Khai Thiên · Tạo Ảnh";

}

</script>

</body>
  </html>
